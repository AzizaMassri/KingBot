services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: kingbot_rabbitmq
    restart: unless-stopped # <-- Change this
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: kingbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kingbotuser
      POSTGRES_PASSWORD: kingbotdbpass
      POSTGRES_DB: kingbotdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kingbot-app:
    build: .
    container_name: kingbot_app
    restart: unless-stopped # <-- Change this
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kingbotuser:kingbotdbpass@postgres:5432/kingbotdb
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

volumes:
  postgres_data:
