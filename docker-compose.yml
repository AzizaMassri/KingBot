services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: kingbot_rabbitmq
    restart: unless-stopped # <-- Change this
    # No host ports: kingbot-app uses rabbitmq:5672 on kingbot_net (avoids clash with another AMQP on host 5672).
    # Management UI (optional): add e.g. ports: - "127.0.0.1:15673:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kingbot_net

  postgres:
    image: postgres:15-alpine
    container_name: kingbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kingbotuser
      POSTGRES_PASSWORD: kingbotdbpass
      POSTGRES_DB: kingbotdb
    # No host ports: kingbot-app uses postgres:5432 on kingbot_net only (avoids clashing with host/docker 5432).
    # Shell: docker compose exec postgres psql -U kingbotuser -d kingbotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kingbotuser -d kingbotdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kingbot_net

  kingbot-app:
    build: .
    container_name: kingbot_app
    restart: unless-stopped # <-- Change this
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kingbotuser:kingbotdbpass@postgres:5432/kingbotdb
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - kingbot_net

networks:
  kingbot_net:
    driver: bridge

volumes:
  postgres_data:
