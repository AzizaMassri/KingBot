services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: kingbot_rabbitmq
    restart: unless-stopped # <-- Change this
    # No host ports: kingbot-app uses rabbitmq:5672 on kingbot_net (avoids clash with another AMQP on host 5672).
    # Management UI (optional): add e.g. ports: - "127.0.0.1:15673:15672"
    # OTP 28+ fails with "Too short cookie string" if cookie is empty (bad .env merge, corrupt file after disk-full, etc.).
    # Use list form so nothing substitutes to empty; only [a-z0-9] to satisfy strict cookie parsing.
    environment:
      - RABBITMQ_ERLANG_COOKIE=7d4e8a1f9c2b6e3a5d8f1c4e7a0b3d6e9f2a5c8b1e4d7f0a3c6e9b2d5f8a1c4e7f0a2b5d8e3f6a9c1
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - kingbot_net

  postgres:
    image: postgres:15-alpine
    container_name: kingbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kingbotuser
      POSTGRES_PASSWORD: kingbotdbpass
      POSTGRES_DB: kingbotdb
    # No host ports: kingbot-app uses postgres:5432 on kingbot_net only (avoids clashing with host/docker 5432).
    # Shell: docker compose exec postgres psql -U kingbotuser -d kingbotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kingbotuser -d kingbotdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kingbot_net

  kingbot-app:
    build: .
    container_name: kingbot_app
    restart: unless-stopped # <-- Change this
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kingbotuser:kingbotdbpass@postgres:5432/kingbotdb
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - kingbot_net

networks:
  kingbot_net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
